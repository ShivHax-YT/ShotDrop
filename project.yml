name: ShotDrop
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShotDrop:
    type: application
    platform: macOS
    sources:
      - path: Sources/ShotDrop
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macfleet.shotdrop
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - ShotDropTests
      gatherCoverageData: true
  ShotDropTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ShotDropTests
    dependencies:
      - target: ShotDrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macfleet.shotdrop.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShotDrop.app/Contents/MacOS/ShotDrop"
        BUNDLE_LOADER: "$(TEST_HOST)"
